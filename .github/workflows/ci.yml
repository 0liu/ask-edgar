# CI (SPEC §8): a throwaway Postgres, the 30-company fixture, the dbt marts, then lint,
# type-check, tests and the evals replayed from cassettes. No API key is needed.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edgar
          POSTGRES_USER: edgar
          POSTGRES_PASSWORD: edgar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edgar -d edgar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://edgar:edgar@localhost:5432/edgar
      # The fixture has about 20 companies with a FY2024 10-K; the full quarter has 4,000+.
      ASK_EDGAR_MIN_FY2024_COMPANIES: "15"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (Python from .python-version, versions from uv.lock)
        run: uv sync --locked

      - name: Load the fixture subset into schema raw
        run: uv run ask-edgar load --fixture

      - name: dbt build (seeds, staging, marts, tests)
        run: make dbt

      - name: ruff, mypy --strict, pytest
        run: make check

      - name: evals, replayed from the cassettes
        run: make evals
