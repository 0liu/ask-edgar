[project]
name = "ask-edgar"
version = "0.1.0"
description = "Text-to-SQL agent over SEC Financial Statement Data Sets"
authors = [
    { name = "Ning Liu", email = "4315932+0liu@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.4.0",
    "dbt-postgres>=1.11.0",
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlglot>=30.27.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ask_edgar"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
