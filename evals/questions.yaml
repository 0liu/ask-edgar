# --- rankings and aggregations (3) ---
- id: q09
  question: Which three companies had the highest net income in FY2024?
  answer_type: list
  oracle_sql: >
    SELECT company_name FROM analytics.fct_financials_wide
    WHERE fiscal_year = 2024 ORDER BY net_income DESC NULLS LAST LIMIT 3

- id: q10
  question: >
    Among Alphabet, Amazon, Meta, Nvidia and Tesla, which companies had FY2024 revenue
    above 150 billion dollars?
  answer_type: list
  oracle_sql: >
    SELECT company_name FROM analytics.fct_financials_wide
    WHERE fiscal_year = 2024 AND revenue > 150e9
      AND (company_name ILIKE 'ALPHABET INC%' OR company_name ILIKE 'AMAZON COM INC%'
           OR company_name ILIKE 'META PLATFORMS%' OR company_name ILIKE 'NVIDIA CORP%'
           OR company_name ILIKE 'TESLA%')

- id: q11
  question: Rank Amazon, Walmart and Exxon Mobil by FY2024 revenue, highest first.
  answer_type: list
  oracle_sql: >
    SELECT company_name FROM analytics.fct_financials_wide
    WHERE fiscal_year = 2024
      AND (company_name ILIKE 'AMAZON COM INC%' OR company_name ILIKE 'WALMART%'
           OR company_name ILIKE 'EXXON MOBIL%')
    ORDER BY revenue DESC

# --- ratios computed in SQL (2) ---
- id: q12
  question: What is Tesla's ratio of total liabilities to stockholders' equity for FY2024?
  answer_type: number
  oracle_sql: >
    SELECT total_liabilities / NULLIF(stockholders_equity, 0)
    FROM analytics.fct_financials_wide
    WHERE company_name ILIKE 'TESLA%' AND fiscal_year = 2024
  tolerance: 0.02

- id: q13
  question: What was Meta's net profit margin (net income divided by revenue) in FY2024?
  answer_type: number
  oracle_sql: >
    SELECT net_income / NULLIF(revenue, 0)
    FROM analytics.fct_financials_wide
    WHERE company_name ILIKE 'META PLATFORMS%' AND fiscal_year = 2024
  tolerance: 0.02

