# Eval questions (SPEC §7). Ground truth comes from oracle_sql, run against the same
# database the agent queries. The agent never sees oracle_sql.
#
# Every question is answerable from the CI fixture subset (Phase 6) with the same result
# as from the full quarter, and uses company names whose ILIKE 'NAME%' pattern matches a
# single filer, so the recorded cassettes replay identically in CI.

# --- single-number lookups (8) ---
- id: q01
  question: What was Alphabet's total revenue in fiscal year 2024?
  answer_type: number
  oracle_sql: >
    SELECT revenue FROM analytics.fct_financials_wide
    WHERE company_name ILIKE 'ALPHABET INC%' AND fiscal_year = 2024
  tolerance: 0.01

- id: q02
  question: What was Amazon's net income in FY2024?
  answer_type: number
  oracle_sql: >
    SELECT net_income FROM analytics.fct_financials_wide
    WHERE company_name ILIKE 'AMAZON COM INC%' AND fiscal_year = 2024
  tolerance: 0.01

- id: q03
  question: What was Nvidia's diluted EPS for fiscal year 2024?
  answer_type: number
  oracle_sql: >
