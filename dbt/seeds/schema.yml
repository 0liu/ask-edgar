version: 2

seeds:
  - name: metric_map
    description: >
      Maps XBRL tags to canonical metrics. When a filing reports several tags for a
      metric the lowest priority wins. kind decides the period: balance = instant
      at the balance-sheet date (qtrs 0); flow and per_share = full year (qtrs 4).
    columns:
      - name: metric
        data_tests: [not_null]
      - name: tag
        data_tests: [not_null, unique]
      - name: priority
        data_tests: [not_null]
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [balance, flow, per_share]
      - name: description
        data_tests: [not_null]

  - name: sic_codes
    description: SEC Standard Industrial Classification code list (444 codes).
    columns:
      - name: sic
        data_tests: [unique, not_null]
      - name: sic_description
        data_tests: [not_null]
